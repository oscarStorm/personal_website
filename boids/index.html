<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="darkreader-lock">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/navigation.js" defer></script>
    <script src="../js/boids.js" defer></script>
    <!--
    <script src="../js/typewriter.js" defer></script>
    -->
    <script src="../js/boids-route.js" defer></script>
    <title>Boids</title>
</head>
<body>
    <canvas id="boid-canvas"></canvas>
    <site-navigation></site-navigation>
    <div class="controls">
        <div class="control">
            <label for="separation">Separation</label>
            <input id="separation" type="range" min="0" max="3" step="0.1" value="0.7">
            <span id="separation-value">0.7</span>
        </div>
        <div class="control">
            <label for="alignment">Alignment</label>
            <input id="alignment" type="range" min="0" max="3" step="0.1" value="0.3">
            <span id="alignment-value">0.3</span>
        </div>
        <div class="control">
            <label for="cohesion">Cohesion</label>
            <input id="cohesion" type="range" min="0" max="3" step="0.1" value="0.8">
            <span id="cohesion-value">0.8</span>
        </div>
    </div>
</body>
</html>
